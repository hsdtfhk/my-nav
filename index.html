<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>作业导航 · 我的网站收藏</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>" />
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2329;
      --muted: #7a8293;
      --bili: #fb7299;
      --border: #ececf1;
      /* height of the fixed controls, so content can start below them */
      --size-control-h: 41px;
      --bg-control-h: 37px;
      --shadow: 0 8px 24px rgba(31, 35, 41, 0.06);
      --name-size: 40px;
      --url-size: 15px;
      --icon-size: 36px;
      --pad-y: 28px;
      --pad-x: 30px;
    }

    body[data-size="small"] {
      --name-size: 24px;
      --url-size: 14px;
      --icon-size: 26px;
      --pad-y: 20px;
      --pad-x: 22px;
    }

    body[data-size="medium"] {
      --name-size: 40px;
      --url-size: 15px;
      --icon-size: 36px;
      --pad-y: 28px;
      --pad-x: 30px;
    }

    body[data-size="large"] {
      --name-size: 64px;
      --url-size: 16px;
      --icon-size: 50px;
      --pad-y: 36px;
      --pad-x: 36px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      /* clear the fixed controls (16px + size control + gap + bg control + 16px) */
      padding: calc(16px + var(--size-control-h) + 8px + var(--bg-control-h) + 16px) 24px 48px;
      display: flex;
      justify-content: center;
    }

    .container { width: 100%; max-width: 720px; }

    header { text-align: center; margin-bottom: 40px; }

    header h1 { font-size: 26px; font-weight: 700; letter-spacing: 1px; }

    header p { margin-top: 8px; color: var(--muted); font-size: 14px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      text-decoration: none;
      color: var(--text);
      padding: 32px 20px;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .card:hover { transform: translateY(-4px); box-shadow: 0 14px 32px rgba(31, 35, 41, 0.1); }

    /* B站卡片 — 醒目突出 */
    .card.bili {
      grid-column: 1 / -1;
      flex-direction: row;
      justify-content: space-between;
      padding: var(--pad-y) var(--pad-x);
      border: none;
      background: linear-gradient(135deg, #fb7299 0%, #ff9fb8 100%);
      color: #ffffff;
    }

    .card.bili .name {
      font-size: var(--name-size);
      font-weight: 800;
      letter-spacing: 0.08em;
      line-height: 1;
    }

    .card.bili .meta { text-align: right; }

    .card.bili .url { font-size: var(--url-size); color: rgba(255, 255, 255, 0.9); }

    .card.bili .hint { margin-top: 6px; font-size: 13px; color: rgba(255, 255, 255, 0.75); }

    /* 横向条卡片（普通网站） */
    .card.bar {
      grid-column: 1 / -1;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: var(--pad-y) var(--pad-x);
      border: none;
      color: #ffffff;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
      -webkit-touch-callout: none;
    }

    .card.bar:hover { transform: translateY(-3px); box-shadow: 0 14px 28px rgba(31, 35, 41, 0.14); }

    .bar-left { display: flex; align-items: center; gap: 14px; min-width: 0; }

    .card.bar .icon { font-size: var(--icon-size); line-height: 1; }

    .icon-box { display: flex; align-items: center; gap: 5px; flex: none; }

    .public-star {
      font-size: calc(var(--icon-size) * 0.45);
      line-height: 1;
      color: #ffd54a;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    }

    .card.bar .name { font-size: var(--name-size); font-weight: 700; letter-spacing: 0.05em; }

    .bar-right { display: flex; align-items: center; gap: 12px; flex: none; }

    .bar-right .meta { text-align: right; }

    .bar-right .url { font-size: var(--url-size); color: rgba(255, 255, 255, 0.92); }

    .bar-right .hint { display: block; margin-top: 4px; font-size: 12px; color: rgba(255, 255, 255, 0.75); }

    .color-dot {
      width: 26px; height: 26px; border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.85);
      cursor: pointer; flex: none;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      transition: transform 0.15s ease;
    }

    .color-dot:hover { transform: scale(1.18); }

    .bar-del {
      width: 26px; height: 26px; line-height: 24px; text-align: center;
      border-radius: 50%; cursor: pointer; flex: none;
      color: rgba(255, 255, 255, 0.85); font-size: 18px;
      background: rgba(0, 0, 0, 0.12);
      transition: background 0.15s ease;
    }

    .bar-del:hover { background: rgba(0, 0, 0, 0.3); }

    .card.add {
      grid-column: 1 / -1;
      flex-direction: row;
      justify-content: center;
      gap: 10px;
      border-style: dashed;
      color: var(--muted);
      background: transparent;
      box-shadow: none;
      padding: 20px;
    }

    .card.add .plus { font-size: 24px; line-height: 1; }
    .card.add .name { font-size: 16px; }

    .card.bar.dragging {
      position: fixed;
      z-index: 100;
      margin: 0;
      opacity: 0.92;
      box-shadow: 0 20px 44px rgba(0, 0, 0, 0.3);
      transition: none;
    }

    .drag-placeholder {
      grid-column: 1 / -1;
      border-radius: 18px;
      border: 2px dashed rgba(0, 0, 0, 0.18);
      background: rgba(0, 0, 0, 0.04);
    }

    .size-control {
      position: fixed; top: 16px; left: 16px; z-index: 40;
      display: flex; align-items: center; gap: 4px;
      background: #fff; border: 1px solid var(--border);
      border-radius: 999px; padding: 4px;
      box-shadow: 0 6px 20px rgba(31, 35, 41, 0.12);
    }

    .size-control .label { font-size: 12px; color: var(--muted); padding: 0 8px 0 10px; }

    .size-btn {
      border: none; background: transparent; padding: 6px 12px;
      border-radius: 999px; font-size: 14px; cursor: pointer; color: var(--text);
      transition: background 0.15s ease, color 0.15s ease;
    }

    .size-btn.active { background: linear-gradient(135deg, #fb7299, #ff9fb8); color: #fff; }

    /* 左上角「添加背景」 */
    .bg-control {
      position: fixed;
      top: calc(16px + var(--size-control-h) + 8px);
      left: 16px;
      z-index: 40;
      display: flex; align-items: center; gap: 4px;
      background: #fff; border: 1px solid var(--border);
      border-radius: 999px; padding: 4px;
      box-shadow: 0 6px 20px rgba(31, 35, 41, 0.12);
    }

    .bg-btn {
      border: none; background: transparent; padding: 6px 12px;
      border-radius: 999px; font-size: 14px; cursor: pointer; color: var(--text);
      white-space: nowrap; transition: background 0.15s ease;
    }

    .bg-btn:hover { background: #f0f1f5; }

    /* 自定义背景：图片层固定在视口后方（手机也兼容） */
    body.has-bg { background: transparent; }

    body.has-bg::before {
      content: '';
      position: fixed; inset: 0; z-index: -1;
      background-image: var(--bg-image);
      background-size: cover; background-position: center; background-repeat: no-repeat;
    }

    body.has-bg .card.add { background: rgba(255, 255, 255, 0.78); }

    body.has-bg header h1,
    body.has-bg header p,
    body.has-bg footer {
      text-shadow: 0 1px 6px rgba(255, 255, 255, 0.9), 0 0 3px rgba(255, 255, 255, 0.9);
    }

    /* 账号助手按钮（只存账号，不存密码） */
    .key-btn {
      width: 26px; height: 26px; line-height: 26px; text-align: center;
      border-radius: 50%; cursor: pointer; flex: none; font-size: 14px;
      background: rgba(0, 0, 0, 0.12);
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .key-btn:hover { transform: scale(1.12); }

    .key-btn.has-acct {
      background: rgba(255, 213, 74, 0.95);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.65);
    }

    /* 账号助手弹窗 */
    .acct-tip { font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 4px; }
    .acct-tip b { color: #e5484d; }

    .modal-box input[readonly] { background: #f6f7fb; color: var(--muted); }

    .acct-extra { display: flex; gap: 10px; margin-top: 12px; }

    .btn.link {
      flex: 1; background: transparent; border: 1px dashed var(--border);
      color: var(--text); font-size: 13px; padding: 9px;
    }

    .btn.link:hover { background: #f6f7fb; }
    .btn.link.danger { color: #e5484d; }

    /* 操作提示条 */
    .toast {
      position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%);
      background: rgba(31, 35, 41, 0.9); color: #fff;
      padding: 10px 18px; border-radius: 999px; font-size: 14px;
      z-index: 60; pointer-events: none; max-width: 90vw; text-align: center;
    }

    .toast[hidden] { display: none; }

    /* 右下角「数据备份」 */
    .backup-fab {
      position: fixed; right: 16px; bottom: 16px; z-index: 40;
      display: flex; align-items: center; gap: 6px;
      background: #fff; border: 1px solid var(--border);
      border-radius: 999px; padding: 10px 16px;
      box-shadow: 0 6px 20px rgba(31, 35, 41, 0.14);
      font-size: 14px; cursor: pointer; color: var(--text);
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .backup-fab:hover { background: #f0f1f5; transform: translateY(-2px); }

    /* 浏览器禁止保存数据时的提示 */
    .storage-warn {
      position: fixed; left: 50%; bottom: 74px; transform: translateX(-50%);
      background: #fff3cd; color: #8a6d3b; border: 1px solid #ffe08a;
      padding: 10px 16px; border-radius: 12px; font-size: 13px;
      z-index: 70; max-width: 90vw; text-align: center;
    }

    .modal {
      position: fixed; inset: 0; background: rgba(20, 22, 28, 0.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 50; padding: 24px;
    }

    .modal[hidden] { display: none; }

    .modal-box {
      background: #fff; border-radius: 18px; padding: 28px 26px;
      width: 100%; max-width: 360px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
    }

    .modal-box h2 { font-size: 20px; margin-bottom: 18px; }

    .modal-box label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }

    .modal-box input[type="text"] {
      width: 100%; padding: 11px 12px; border: 1px solid var(--border);
      border-radius: 10px; font-size: 15px; outline: none;
    }

    .modal-box input[type="text"]:focus { border-color: #fb7299; }

    .modal-box input[type="color"] {
      width: 100%; height: 38px; border: 1px solid var(--border);
      border-radius: 10px; padding: 4px; background: none; cursor: pointer; margin-top: 10px;
    }

    .modal-actions { display: flex; gap: 10px; margin-top: 22px; }

    .btn { flex: 1; padding: 11px; border-radius: 10px; border: none; font-size: 15px; cursor: pointer; }
    .btn.ghost { background: #f0f1f5; color: var(--text); }
    .btn.primary { background: linear-gradient(135deg, #fb7299, #ff9fb8); color: #fff; }

    .color-menu {
      position: fixed; z-index: 30; background: #fff; border-radius: 14px;
      padding: 16px; box-shadow: 0 16px 48px rgba(0, 0, 0, 0.22); min-width: 190px;
    }

    .color-menu[hidden] { display: none; }

    .color-menu .cm-title { font-size: 13px; color: var(--muted); margin-bottom: 10px; }

    .color-menu input[type="color"] {
      width: 100%; height: 36px; border: 1px solid var(--border);
      border-radius: 8px; padding: 2px; background: none; cursor: pointer;
    }

    .swatches { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

    .swatch {
      width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent; transition: transform 0.12s ease;
    }

    .swatch:hover { transform: scale(1.15); }
    .swatch.active { border-color: #1f2329; }

    .cm-reset {
      margin-top: 12px; width: 100%; padding: 8px; border: none;
      background: #f0f1f5; border-radius: 8px; font-size: 13px; cursor: pointer; color: var(--text);
    }

    footer { margin-top: 40px; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.8; }
  </style>
</head>
<body>
  <div class="size-control">
    <span class="label">大小</span>
    <button class="size-btn" data-size="large">大</button>
    <button class="size-btn" data-size="medium">中</button>
    <button class="size-btn" data-size="small">小</button>
  </div>

  <!-- 左上角「添加背景」 -->
  <div class="bg-control">
    <button class="bg-btn" id="bg-add">🖼 添加背景</button>
    <button class="bg-btn" id="bg-remove" hidden>🗑 移除背景</button>
  </div>

  <!-- 右下角：数据备份 -->
  <button class="backup-fab" id="backup-btn">💾 备份</button>

  <div class="container">
    <header>
      <h1>作业导航</h1>
      <p>点击卡片，一键跳转到对应网站</p>
    </header>

    <div class="grid" id="grid">
      <!-- B站：固定醒目横幅（如需修改，直接改这里） -->
      <a class="card bili" href="https://www.bilibili.com" target="_blank" rel="noopener">
        <span class="name">B 站</span>
        <span class="meta">
          <span class="url">www.bilibili.com</span>
          <span class="hint">点击进入 ↗</span>
        </span>
      </a>

      <!-- 公共网站 + 个人网站由脚本渲染到此处 -->

      <a class="card add" href="#" id="add-card">
        <span class="plus">＋</span>
        <span class="name">添加网站</span>
      </a>
    </div>

    <footer>
      点击彩色圆点、或右键卡片，即可自定义它的颜色<br />
      左上角「大 / 中 / 小」可统一调整所有卡片的大小<br />
      按住卡片上下拖动即可排序（手机需长按后再拖动）<br />
      点卡片上的 🔑 记账号 · 左上角「添加背景」换背景（都不含密码）
    </footer>
  </div>

  <!-- 添加网站弹窗 -->
  <div class="modal" id="modal" hidden>
    <div class="modal-box">
      <h2>添加网站</h2>
      <label for="site-name">名称</label>
      <input id="site-name" type="text" placeholder="例如：教务系统" />
      <label for="site-url">网址</label>
      <input id="site-url" type="text" placeholder="例如：jwc.example.edu.cn" />
      <label>颜色</label>
      <div class="swatches" id="modal-swatches"></div>
      <input type="color" id="site-color" value="#64748b" />
      <div class="modal-actions">
        <button class="btn ghost" id="cancel-btn">取消</button>
        <button class="btn primary" id="save-btn">添加</button>
      </div>
    </div>
  </div>

  <!-- 颜色选择菜单 -->
  <div class="color-menu" id="color-menu" hidden>
    <div class="cm-title">自定义颜色</div>
    <input type="color" id="color-input" />
    <div class="swatches" id="menu-swatches"></div>
    <button class="cm-reset" id="reset-color">恢复默认颜色</button>
  </div>

  <!-- 账号助手弹窗（只存账号，不存密码） -->
  <div class="modal" id="acct-modal" hidden>
    <div class="modal-box">
      <h2>账号助手</h2>
      <p class="acct-tip">只保存<b>账号和备注</b>，<b>不会保存密码</b>。密码请让浏览器记住并自动填充。</p>
      <label for="acct-site">网站</label>
      <input id="acct-site" type="text" readonly />
      <label for="acct-user">账号 / 用户名</label>
      <input id="acct-user" type="text" placeholder="例如：学号 / 手机号 / 邮箱" />
      <label for="acct-note">备注（可选）</label>
      <input id="acct-note" type="text" placeholder="例如：密码是生日 / 需先连校园网" />
      <div class="modal-actions">
        <button class="btn ghost" id="acct-cancel">取消</button>
        <button class="btn primary" id="acct-save">保存</button>
      </div>
      <div class="acct-extra">
        <button class="btn link" id="acct-copy">📋 复制账号</button>
        <button class="btn link danger" id="acct-clear">🗑 清空记录</button>
      </div>
    </div>
  </div>

  <!-- 操作提示 -->
  <div class="toast" id="toast" hidden></div>

  <!-- 数据备份弹窗 -->
  <div class="modal" id="backup-modal" hidden>
    <div class="modal-box">
      <h2>数据备份</h2>
      <p class="acct-tip">把你在本站的全部设置（网站、颜色、顺序、账号、背景）导出成一个文件保存；换设备或数据丢了，用它一键还原。</p>
      <div class="modal-actions">
        <button class="btn ghost" id="backup-cancel">关闭</button>
        <button class="btn primary" id="backup-export">📤 导出备份</button>
      </div>
      <div class="acct-extra">
        <button class="btn link" id="backup-import">📥 选择备份文件导入</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // ============================================================
      // ★ 管理者区域：在这里添加 / 修改「公共网站」
      //   改完保存后，把整个 index.html 重新上传到 GitHub，
      //   大家刷新页面就能看到新的公共网站。
      //
      //   格式说明：
      //   id   —— 每个网站唯一的英文编号（不要重复，建议用拼音或英文）
      //   name —— 卡片上显示的名称
      //   url  —— 网址（完整网址，https:// 开头）
      //   icon —— 图标，一个 emoji 即可
      //   color—— 默认颜色（用户仍可在自己浏览器里改）
      //
      //   想新增一个公共网站，就复制下面任意一行，改一改再粘到列表末尾。
      // ============================================================
      var PUBLIC_SITES = [
        { id: 'math',    name: '高数',          url: 'https://www.icourse163.org/learn/NEU-1001639002?tid=1488009446#/learn/content', icon: '📐', color: '#4f7cff' },
        { id: 'memo',    name: '喵喵背单词',    url: 'https://studio.memocard.cn/memo-api/s/3hSF1fXoCjJTp9pzPz8FWw2SW3ZCpb-2', icon: '🐱', color: '#ff9f43' },
        { id: 'zhidao',  name: '知到',          url: 'https://onlineweb.zhihuishu.com/onlinestuh5', icon: '🎓', color: '#22c55e' },
        { id: 'iwrite',  name: '爱写作',        url: 'https://iwrite.unipus.cn', icon: '✍️', color: '#8b5cf6' },
        { id: 'dolphin', name: '海豚实验平台',  url: 'https://neu.aige.dilabs.cn/user-center/login/index', icon: '🐬', color: '#14b8a6' },
        { id: 'chem',    name: '化学实验选课',  url: 'http://210.30.206.181:380/model/Center/selectitemtime.aspx?tblKssyxmid=244&tblexplanid=151&schoolyearid=48&tblECourseID=500&tblPubCourseID=1225', icon: '🧪', color: '#0ea5e9' },
        { id: 'xuanke',  name: '一般选课',      url: 'https://jwxk.neu.edu.cn/xsxk/profile/index.html', icon: '📋', color: '#f43f5e' }
      ];

      var PALETTE = [
        '#4f7cff', '#ff9f43', '#22c55e', '#8b5cf6',
        '#14b8a6', '#fb7299', '#f43f5e', '#64748b'
      ];

      // 本地存储键（个人数据，每人浏览器一份，互不影响）
      var LS = {
        personal: 'mg2-personal', // 用户自己添加的网站
        hidden: 'mg2-hidden',     // 用户删掉的公共网站 id
        order: 'mg2-order',       // 用户排好的顺序
        colors: 'mg2-colors',     // 用户对公共网站的颜色覆盖
        size: 'mg2-size',         // 大中小档位
        acct: 'mg2-accounts',     // 账号助手：账号 + 备注（不含密码）
        bg: 'mg2-bg'              // 自定义背景图片
      };

      var grid = document.getElementById('grid');
      var addCard = document.getElementById('add-card');

      var modal = document.getElementById('modal');
      var nameInput = document.getElementById('site-name');
      var urlInput = document.getElementById('site-url');
      var modalColorInput = document.getElementById('site-color');
      var modalSwatches = document.getElementById('modal-swatches');
      var saveBtn = document.getElementById('save-btn');
      var cancelBtn = document.getElementById('cancel-btn');

      var colorMenu = document.getElementById('color-menu');
      var colorInput = document.getElementById('color-input');
      var menuSwatches = document.getElementById('menu-swatches');
      var resetBtn = document.getElementById('reset-color');

      var activeId = null;
      var modalColor = '#4f7cff';

      // ---------- 本地存储：安全读写（任何情况下都不抛错） ----------
      // 有些浏览器/设置会禁止站点保存数据；此时页面照常能用，只是不记住改动。
      var storageOK = (function () {
        try {
          var t = '__nav_probe__';
          localStorage.setItem(t, '1');
          localStorage.removeItem(t);
          return true;
        } catch (e) { return false; }
      })();

      function readRaw(key) {
        if (!storageOK) return null;
        try { return localStorage.getItem(key); } catch (e) { return null; }
      }

      function writeRaw(key, val) {
        if (!storageOK) return false;
        try { localStorage.setItem(key, val); return true; } catch (e) { return false; }
      }

      function removeRaw(key) {
        if (!storageOK) return;
        try { localStorage.removeItem(key); } catch (e) {}
      }

      function read(key, fallback) {
        var raw = readRaw(key);
        if (raw == null) return fallback;
        try {
          var v = JSON.parse(raw);
          return v == null ? fallback : v;
        } catch (e) { return fallback; }
      }

      function write(key, val) {
        return writeRaw(key, JSON.stringify(val));
      }

      // 用户主动操作时用这个：保存失败会给出提示
      function persist(key, val) {
        var ok = write(key, val);
        if (!ok) showToast('保存失败：浏览器不让本站存数据，或空间已满');
        return ok;
      }

      // ---------- 尺寸切换 ----------
      var sizeButtons = document.querySelectorAll('.size-btn');
      function applySize(size) {
        document.body.setAttribute('data-size', size);
        sizeButtons.forEach(function (b) {
          b.classList.toggle('active', b.getAttribute('data-size') === size);
        });
        writeRaw(LS.size, size);
      }
      sizeButtons.forEach(function (b) {
        b.addEventListener('click', function () { applySize(b.getAttribute('data-size')); });
      });
      applySize(readRaw(LS.size) || 'medium');

      function normalizeUrl(u) {
        u = (u || '').trim();
        if (!u) return '';
        if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
        return u;
      }

      function displayUrl(u) {
        try {
          var a = document.createElement('a');
          a.href = normalizeUrl(u);
          return a.hostname;
        } catch (e) { return u.replace(/^https?:\/\//i, ''); }
      }

      function hexToRgb(h) {
        h = h.replace('#', '');
        if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
        var n = parseInt(h, 16);
        return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
      }

      function rgbToHex(c) {
        return '#' + [c.r, c.g, c.b].map(function (x) {
          var s = x.toString(16);
          return s.length < 2 ? '0' + s : s;
        }).join('');
      }

      function mixHex(c1, c2, t) {
        var a = hexToRgb(c1);
        var b = hexToRgb(c2);
        return rgbToHex({
          r: Math.round(a.r + (b.r - a.r) * t),
          g: Math.round(a.g + (b.g - a.g) * t),
          b: Math.round(a.b + (b.b - a.b) * t)
        });
      }

      function gradient(c) { return 'linear-gradient(135deg, ' + c + ', ' + mixHex(c, '#ffffff', 0.35) + ')'; }

      function isPublicId(id) {
        return PUBLIC_SITES.some(function (p) { return p.id === id; });
      }

      // ---------- 合并：公共（去掉用户删的）+ 个人 ----------
      function visibleSites() {
        var hidden = read(LS.hidden, []);
        var personal = read(LS.personal, []);
        var colors = read(LS.colors, {});
        var list = [];

        PUBLIC_SITES.forEach(function (p) {
          if (hidden.indexOf(p.id) === -1) {
            list.push({ id: p.id, name: p.name, url: p.url, icon: p.icon, color: colors[p.id] || p.color, kind: 'public' });
          }
        });
        personal.forEach(function (s) {
          list.push({ id: s.id, name: s.name, url: s.url, icon: s.icon || '🔗', color: s.color || '#64748b', kind: 'personal' });
        });

        // 应用用户排好的顺序（新出现的公共网站追加到末尾）
        var order = read(LS.order, null);
        if (Array.isArray(order) && order.length) {
          var map = {};
          list.forEach(function (s) { map[s.id] = s; });
          var ordered = [];
          order.forEach(function (id) { if (map[id]) { ordered.push(map[id]); delete map[id]; } });
          list.forEach(function (s) { if (map[s.id]) ordered.push(s); });
          list = ordered;
        }
        write(LS.order, list.map(function (s) { return s.id; }));
        return list;
      }

      // ---------- 渲染 ----------
      function buildBar(site, index) {
        var a = document.createElement('a');
        a.className = 'card bar';
        a.setAttribute('data-id', site.id);
        a.href = normalizeUrl(site.url);
        a.target = '_blank';
        a.rel = 'noopener';
        a.style.background = gradient(site.color);
        a.setAttribute('draggable', 'false');
        a.addEventListener('dragstart', function (e) { e.preventDefault(); });

        var left = document.createElement('span');
        left.className = 'bar-left';

        var iconBox = document.createElement('span');
        iconBox.className = 'icon-box';

        if (site.kind === 'public') {
          var star = document.createElement('span');
          star.className = 'public-star';
          star.textContent = '★';
          star.title = '公共网站';
          iconBox.appendChild(star);
        }

        var icon = document.createElement('span');
        icon.className = 'icon';
        icon.textContent = site.icon;
        iconBox.appendChild(icon);

        var name = document.createElement('span');
        name.className = 'name';
        name.textContent = site.name;
        left.appendChild(iconBox);
        left.appendChild(name);

        var right = document.createElement('span');
        right.className = 'bar-right';
        var meta = document.createElement('span');
        meta.className = 'meta';
        var url = document.createElement('span');
        url.className = 'url';
        url.textContent = displayUrl(site.url);
        var hint = document.createElement('span');
        hint.className = 'hint';
        hint.textContent = '点击进入 ↗';
        meta.appendChild(url);
        meta.appendChild(hint);

        var dot = document.createElement('span');
        dot.className = 'color-dot';
        dot.title = '自定义颜色（也可右键卡片）';
        dot.style.background = site.color;
        dot.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          openColorMenu(site.id, dot);
        });

        var del = document.createElement('span');
        del.className = 'bar-del';
        del.textContent = '×';
        del.title = '删除该网站';
        del.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          removeSite(site.id);
        });

        // 🔑 账号助手（只存账号，不存密码）
        var hasAcct = !!loadAccounts()[site.id];
        var keyBtn = document.createElement('span');
        keyBtn.className = 'key-btn' + (hasAcct ? ' has-acct' : '');
        keyBtn.textContent = '🔑';
        keyBtn.title = hasAcct ? '已保存账号（点击查看 / 复制）' : '保存账号（只存账号，不存密码）';
        keyBtn.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          openAcct(site.id);
        });

        right.appendChild(meta);
        right.appendChild(keyBtn);
        right.appendChild(dot);
        right.appendChild(del);

        a.appendChild(left);
        a.appendChild(right);

        a.addEventListener('contextmenu', function (e) {
          e.preventDefault();
          if (lastPointerType === 'touch') return;
          openColorMenu(site.id, null, e.clientX, e.clientY);
        });

        a.addEventListener('pointerdown', function (e) {
          onPointerDown(e, index, a);
        });

        a.addEventListener('click', function (e) {
          if (suppressClick) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);

        return a;
      }

      function render() {
        var olds = grid.querySelectorAll('.card.bar');
        for (var i = 0; i < olds.length; i++) olds[i].remove();
        var list = visibleSites();
        list.forEach(function (site, i) {
          grid.insertBefore(buildBar(site, i), addCard);
        });
      }

      function removeSite(id) {
        if (isPublicId(id)) {
          var hidden = read(LS.hidden, []);
          if (hidden.indexOf(id) === -1) hidden.push(id);
          persist(LS.hidden, hidden);
        } else {
          persist(LS.personal, read(LS.personal, []).filter(function (s) { return s.id !== id; }));
        }
        render();
      }

      // ---------- 颜色菜单 ----------
      function fillSwatches(container, current, onPick) {
        container.innerHTML = '';
        PALETTE.forEach(function (c) {
          var s = document.createElement('span');
          s.className = 'swatch' + (c.toLowerCase() === (current || '').toLowerCase() ? ' active' : '');
          s.style.background = c;
          s.addEventListener('click', function () { onPick(c); });
          container.appendChild(s);
        });
      }

      function updateMenuSwatches(current) {
        fillSwatches(menuSwatches, current, function (c) {
          if (activeId) applyColor(activeId, c);
          colorInput.value = c;
          updateMenuSwatches(c);
        });
      }

      function siteColor(id) {
        var list = visibleSites();
        for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i].color;
        return '#64748b';
      }

      function defaultColor(id) {
        for (var i = 0; i < PUBLIC_SITES.length; i++) if (PUBLIC_SITES[i].id === id) return PUBLIC_SITES[i].color;
        return '#64748b';
      }

      function applyColor(id, color) {
        if (isPublicId(id)) {
          var colors = read(LS.colors, {});
          colors[id] = color;
          write(LS.colors, colors);
        } else {
          var personal = read(LS.personal, []);
          personal.forEach(function (s) { if (s.id === id) s.color = color; });
          write(LS.personal, personal);
        }
        var bar = grid.querySelector('.card.bar[data-id="' + id + '"]');
        if (bar) {
          bar.style.background = gradient(color);
          var dot = bar.querySelector('.color-dot');
          if (dot) dot.style.background = color;
        }
      }

      function openColorMenu(id, dot, x, y) {
        activeId = id;
        colorInput.value = siteColor(id);
        updateMenuSwatches(siteColor(id));
        colorMenu.hidden = false;

        var w = colorMenu.offsetWidth;
        var h = colorMenu.offsetHeight;
        var px, py;
        if (dot) {
          var r = dot.getBoundingClientRect();
          px = r.right - w;
          py = r.bottom + 8;
        } else {
          px = x;
          py = y;
        }
        px = Math.min(Math.max(12, px), window.innerWidth - w - 12);
        py = Math.min(Math.max(12, py), window.innerHeight - h - 12);
        colorMenu.style.left = px + 'px';
        colorMenu.style.top = py + 'px';
      }

      function closeColorMenu() {
        colorMenu.hidden = true;
        activeId = null;
      }

      colorInput.addEventListener('input', function () {
        if (activeId) {
          applyColor(activeId, colorInput.value);
          updateMenuSwatches(colorInput.value);
        }
      });

      resetBtn.addEventListener('click', function () {
        if (!activeId) return;
        var def = defaultColor(activeId);
        applyColor(activeId, def);
        colorInput.value = def;
        updateMenuSwatches(def);
      });

      document.addEventListener('click', function (e) {
        if (colorMenu.hidden) return;
        if (colorMenu.contains(e.target)) return;
        if (e.target.closest && e.target.closest('.color-dot')) return;
        closeColorMenu();
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeColorMenu();
      });

      // ---------- 账号助手（只存账号，不存密码） ----------
      var acctModal = document.getElementById('acct-modal');
      var acctSite = document.getElementById('acct-site');
      var acctUser = document.getElementById('acct-user');
      var acctNote = document.getElementById('acct-note');
      var acctCancel = document.getElementById('acct-cancel');
      var acctSave = document.getElementById('acct-save');
      var acctCopy = document.getElementById('acct-copy');
      var acctClear = document.getElementById('acct-clear');
      var toastEl = document.getElementById('toast');
      var acctId = null;

      function loadAccounts() { return read(LS.acct, {}); }
      function saveAccounts(obj) { return write(LS.acct, obj); }

      function findSite(id) {
        var list = visibleSites();
        for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
        return null;
      }

      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.hidden = false;
        clearTimeout(showToast._t);
        showToast._t = setTimeout(function () { toastEl.hidden = true; }, 1800);
      }

      function fallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.top = '-1000px';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
      }

      function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
          return navigator.clipboard.writeText(text).catch(function () { fallbackCopy(text); });
        }
        fallbackCopy(text);
        return Promise.resolve();
      }

      // the viewport scrolls on <html> here, so lock both (same as the add modal)
      function lockScroll(on) {
        document.documentElement.style.overflow = on ? 'hidden' : '';
        document.body.style.overflow = on ? 'hidden' : '';
      }

      function openAcct(id) {
        var site = findSite(id);
        if (!site) return;
        acctId = id;
        var rec = loadAccounts()[id] || {};
        acctSite.value = site.name + '  ·  ' + displayUrl(site.url);
        acctUser.value = rec.username || '';
        acctNote.value = rec.note || '';
        acctModal.hidden = false;
        lockScroll(true);
        acctUser.focus();
      }

      function closeAcct() {
        acctModal.hidden = true;
        acctId = null;
        lockScroll(false);
      }

      acctSave.addEventListener('click', function () {
        if (!acctId) return;
        var accts = loadAccounts();
        var username = acctUser.value.trim();
        var note = acctNote.value.trim();
        if (!username && !note) delete accts[acctId];
        else accts[acctId] = { username: username, note: note };
        var ok = saveAccounts(accts);
        closeAcct();
        render();
        if (!ok) { showToast('保存失败：浏览器不让本站存数据'); return; }
        showToast(username ? '已保存账号' : '已保存备注');
      });

      acctCopy.addEventListener('click', function () {
        var u = acctUser.value.trim();
        if (!u) { showToast('还没有填写账号'); acctUser.focus(); return; }
        copyText(u).then(function () { showToast('已复制账号：' + u); });
      });

      acctClear.addEventListener('click', function () {
        if (!acctId) return;
        var accts = loadAccounts();
        delete accts[acctId];
        saveAccounts(accts);
        acctUser.value = '';
        acctNote.value = '';
        closeAcct();
        render();
        showToast('已清空该网站的记录');
      });

      acctCancel.addEventListener('click', closeAcct);
      acctModal.addEventListener('click', function (e) { if (e.target === acctModal) closeAcct(); });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !acctModal.hidden) closeAcct();
      });

      // ---------- 背景图片（只支持静态图片） ----------
      var bgAdd = document.getElementById('bg-add');
      var bgRemove = document.getElementById('bg-remove');
      var bgFile = document.createElement('input');
      bgFile.type = 'file';
      bgFile.accept = 'image/*';
      bgFile.style.display = 'none';
      document.body.appendChild(bgFile);

      function applyBg(dataUrl) {
        if (dataUrl) {
          document.body.style.setProperty('--bg-image', 'url("' + dataUrl + '")');
          document.body.classList.add('has-bg');
          bgRemove.hidden = false;
          bgAdd.textContent = '🖼 更换背景';
        } else {
          document.body.style.removeProperty('--bg-image');
          document.body.classList.remove('has-bg');
          bgRemove.hidden = true;
          bgAdd.textContent = '🖼 添加背景';
        }
      }

      // 把图片缩到合适尺寸再转成 JPEG，避免手机大图撑爆本地存储
      function downscale(src, cb) {
        var img = new Image();
        img.onload = function () {
          function enc(max, q) {
            var w = img.naturalWidth;
            var h = img.naturalHeight;
            var scale = Math.min(1, max / Math.max(w, h));
            var cw = Math.max(1, Math.round(w * scale));
            var ch = Math.max(1, Math.round(h * scale));
            var canvas = document.createElement('canvas');
            canvas.width = cw;
            canvas.height = ch;
            var ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, cw, ch);
            ctx.drawImage(img, 0, 0, cw, ch);
            try { return canvas.toDataURL('image/jpeg', q); } catch (e) { return null; }
          }
          var out = enc(1920, 0.82);
          if (!out || out.length > 3500000) out = enc(1280, 0.7);
          if (!out || out.length > 3500000) out = enc(960, 0.6);
          if (out && out.length > 3500000) out = null;
          cb(out);
        };
        img.onerror = function () { cb(null); };
        img.src = src;
      }

      bgAdd.addEventListener('click', function () {
        bgFile.value = '';
        bgFile.click();
      });

      bgFile.addEventListener('change', function () {
        var file = bgFile.files && bgFile.files[0];
        if (!file) return;
        if (file.type.indexOf('image/') !== 0) { showToast('请选择图片文件'); return; }
        var reader = new FileReader();
        reader.onload = function (e) {
          downscale(e.target.result, function (out) {
            if (!out) { showToast('这张图片处理不了，换一张试试'); return; }
            if (!writeRaw(LS.bg, out)) {
              showToast('图片太大存不下，换一张小一点的吧');
              return;
            }
            applyBg(out);
            showToast('背景已添加');
          });
        };
        reader.onerror = function () { showToast('图片读取失败'); };
        reader.readAsDataURL(file);
      });

      bgRemove.addEventListener('click', function () {
        removeRaw(LS.bg);
        applyBg(null);
        showToast('背景已移除');
      });

      // 启动时恢复上次设置的背景
      (function () {
        var saved = readRaw(LS.bg);
        if (saved) applyBg(saved);
      })();

      // ---------- 添加网站弹窗 ----------
      function updateModalSwatches(current) {
        fillSwatches(modalSwatches, current, function (c) {
          modalColor = c;
          modalColorInput.value = c;
          updateModalSwatches(c);
        });
      }

      function openModal() {
        modalColor = PALETTE[Math.floor(Math.random() * PALETTE.length)];
        nameInput.value = '';
        urlInput.value = '';
        modalColorInput.value = modalColor;
        updateModalSwatches(modalColor);
        modal.hidden = false;
        // the viewport scrolls on <html> here, not <body>, so lock both
        document.documentElement.style.overflow = 'hidden';
        document.body.style.overflow = 'hidden';
        nameInput.focus();
      }

      function closeModal() {
        modal.hidden = true;
        document.documentElement.style.overflow = '';
        document.body.style.overflow = '';
      }

      addCard.addEventListener('click', function (e) { e.preventDefault(); openModal(); });
      cancelBtn.addEventListener('click', closeModal);
      modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });

      modalColorInput.addEventListener('input', function () {
        modalColor = modalColorInput.value;
        updateModalSwatches(modalColor);
      });

      saveBtn.addEventListener('click', function () {
        var name = nameInput.value.trim();
        var url = normalizeUrl(urlInput.value);
        if (!name) { nameInput.focus(); return; }
        if (!url) { urlInput.focus(); return; }
        var personal = read(LS.personal, []);
        personal.push({
          id: 'p' + Date.now() + Math.floor(Math.random() * 1000),
          name: name, url: url, icon: '🔗', color: modalColor
        });
        persist(LS.personal, personal);
        render();
        closeModal();
      });

      urlInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') saveBtn.click(); });
      nameInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') urlInput.focus(); });

      // ---------- 拖动排序 ----------
      var drag = null;
      var placeholder = null;
      var suppressClick = false;
      var lastPointerType = 'mouse';

      function getBars() {
        return Array.prototype.slice.call(grid.querySelectorAll('.card.bar'))
          .filter(function (b) { return !drag || b !== drag.el; });
      }

      function barCenterY(el) {
        var r = el.getBoundingClientRect();
        return r.top + r.height / 2;
      }

      function computePlaceIndex(pointerY) {
        var bars = getBars();
        var idx = 0;
        for (var i = 0; i < bars.length; i++) {
          if (pointerY > barCenterY(bars[i])) idx++;
          else break;
        }
        return idx;
      }

      function movePlaceholder(idx) {
        var bars = getBars();
        if (idx < bars.length) grid.insertBefore(placeholder, bars[idx]);
        else grid.insertBefore(placeholder, addCard);
      }

      function reorderBarsFLIP(before) {
        for (var i = 0; i < before.length; i++) {
          var el = before[i].el;
          var delta = before[i].top - el.getBoundingClientRect().top;
          if (Math.abs(delta) > 0.5) {
            el.style.transition = 'none';
            el.style.transform = 'translateY(' + delta + 'px)';
            void el.offsetWidth;
            el.style.transition = 'transform 0.22s cubic-bezier(0.2, 0, 0, 1)';
            el.style.transform = '';
          }
        }
      }

      function beginDrag(el, index, clientX, clientY) {
        var rect = el.getBoundingClientRect();
        drag = {
          el: el,
          fromIndex: index,
          placeIndex: index,
          offsetX: clientX - rect.left,
          offsetY: clientY - rect.top
        };

        placeholder = document.createElement('div');
        placeholder.className = 'drag-placeholder';
        placeholder.style.height = rect.height + 'px';
        el.parentNode.insertBefore(placeholder, el);

        el.classList.add('dragging');
        el.style.width = rect.width + 'px';
        el.style.left = rect.left + 'px';
        el.style.top = rect.top + 'px';
        el.style.touchAction = 'none';
        document.body.style.touchAction = 'none';

        suppressClick = true;
        document.addEventListener('pointermove', onDragMove);
        document.addEventListener('pointerup', onDragEnd);
        document.addEventListener('pointercancel', onDragEnd);
      }

      function onDragMove(e) {
        if (!drag) return;
        drag.el.style.left = (e.clientX - drag.offsetX) + 'px';
        drag.el.style.top = (e.clientY - drag.offsetY) + 'px';

        var idx = computePlaceIndex(e.clientY);
        if (idx !== drag.placeIndex) {
          var before = getBars().map(function (b) {
            return { el: b, top: b.getBoundingClientRect().top };
          });
          drag.placeIndex = idx;
          movePlaceholder(idx);
          reorderBarsFLIP(before);
        }
      }

      function onDragEnd() {
        if (!drag) return;

        var order = read(LS.order, []);
        var movedId = order.splice(drag.fromIndex, 1)[0];
        if (movedId !== undefined) {
          order.splice(drag.placeIndex, 0, movedId);
          persist(LS.order, order);
        }

        var el = drag.el;
        var slotRect = placeholder.getBoundingClientRect();
        var elRect = el.getBoundingClientRect();
        var dx = elRect.left - slotRect.left;
        var dy = elRect.top - slotRect.top;

        placeholder.parentNode.insertBefore(el, placeholder);
        placeholder.remove();

        getBars().forEach(function (b) {
          b.style.transition = '';
          b.style.transform = '';
        });

        el.classList.remove('dragging');
        el.style.position = '';
        el.style.left = '';
        el.style.top = '';
        el.style.width = '';
        el.style.zIndex = '';
        el.style.margin = '';
        el.style.touchAction = '';
        document.body.style.touchAction = '';

        if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
          el.style.transition = 'none';
          el.style.transform = 'translate(' + dx + 'px, ' + dy + 'px)';
          void el.offsetWidth;
          el.style.transition = 'transform 0.22s cubic-bezier(0.2, 0, 0, 1)';
          el.style.transform = '';
          setTimeout(render, 240);
        } else {
          setTimeout(render, 0);
        }

        drag = null;
        placeholder = null;
        setTimeout(function () { suppressClick = false; }, 0);
        document.removeEventListener('pointermove', onDragMove);
        document.removeEventListener('pointerup', onDragEnd);
        document.removeEventListener('pointercancel', onDragEnd);
      }

      function onPointerDown(e, index, el) {
        lastPointerType = e.pointerType || 'mouse';
        if (e.button !== 0) return;
        if (e.target.closest && e.target.closest('.color-dot, .bar-del, .key-btn')) return;

        var startX = e.clientX;
        var startY = e.clientY;
        var isTouch = e.pointerType === 'touch';
        var longPressTimer = null;
        var started = false;

        function cleanup() {
          if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
          document.removeEventListener('pointercancel', onUp);
        }

        function start() {
          if (started) return;
          started = true;
          cleanup();
          beginDrag(el, index, startX, startY);
        }

        function onMove(ev) {
          var dx = ev.clientX - startX;
          var dy = ev.clientY - startY;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (isTouch) { if (dist > 10) cleanup(); }
          else { if (dist > 6) start(); }
        }

        function onUp() { cleanup(); }

        if (isTouch) longPressTimer = setTimeout(start, 280);

        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
        document.addEventListener('pointercancel', onUp);
      }

      // ---------- 数据备份（导出 / 导入） ----------
      var JSON_KEYS = ['personal', 'hidden', 'order', 'colors', 'acct'];
      var RAW_KEYS = ['size', 'bg'];

      var backupModal = document.getElementById('backup-modal');
      var backupBtn = document.getElementById('backup-btn');
      var backupCancel = document.getElementById('backup-cancel');
      var backupExport = document.getElementById('backup-export');
      var backupImport = document.getElementById('backup-import');
      var importFile = document.createElement('input');
      importFile.type = 'file';
      importFile.accept = '.json,application/json';
      importFile.style.display = 'none';
      document.body.appendChild(importFile);

      function openBackup() {
        backupModal.hidden = false;
        lockScroll(true);
      }
      function closeBackup() {
        backupModal.hidden = true;
        lockScroll(false);
      }

      backupBtn.addEventListener('click', openBackup);
      backupCancel.addEventListener('click', closeBackup);
      backupModal.addEventListener('click', function (e) { if (e.target === backupModal) closeBackup(); });

      function buildBackup() {
        var out = { app: 'zuoye-nav', version: 1, exportedAt: new Date().toISOString(), data: {} };
        JSON_KEYS.forEach(function (k) {
          var v = read(LS[k], null);
          if (v !== null) out.data[k] = v;
        });
        RAW_KEYS.forEach(function (k) {
          var v = readRaw(LS[k]);
          if (v !== null) out.data[k] = v;
        });
        return out;
      }

      backupExport.addEventListener('click', function () {
        try {
          var blob = new Blob([JSON.stringify(buildBackup())], { type: 'application/json' });
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          var d = new Date();
          var stamp = '' + d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2);
          a.href = url;
          a.download = '作业导航备份-' + stamp + '.json';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
          closeBackup();
          showToast('备份已导出，请保存好这个文件');
        } catch (e) {
          showToast('导出失败，换一个浏览器试试');
        }
      });

      backupImport.addEventListener('click', function () {
        importFile.value = '';
        importFile.click();
      });

      importFile.addEventListener('change', function () {
        var f = importFile.files && importFile.files[0];
        if (!f) return;
        var reader = new FileReader();
        reader.onload = function (e) {
          var obj;
          try { obj = JSON.parse(e.target.result); }
          catch (err) { showToast('这个文件不是有效的备份文件'); return; }
          if (!obj || obj.app !== 'zuoye-nav' || !obj.data) { showToast('这不是本站的备份文件'); return; }
          if (!window.confirm('导入会覆盖你当前的全部设置，确定继续吗？')) return;
          var d = obj.data;
          JSON_KEYS.forEach(function (k) { if (d[k] !== undefined) write(LS[k], d[k]); });
          RAW_KEYS.forEach(function (k) { if (d[k] !== undefined) writeRaw(LS[k], d[k]); });
          if (d.size) applySize(d.size);
          if (d.bg) applyBg(d.bg);
          render();
          closeBackup();
          showToast('备份已导入，设置已还原');
        };
        reader.onerror = function () { showToast('文件读取失败'); };
        reader.readAsText(f);
      });

      // 浏览器禁止保存数据时给个提示（页面照常可用）
      if (!storageOK) {
        var warn = document.createElement('div');
        warn.className = 'storage-warn';
        warn.textContent = '⚠️ 你的浏览器禁止本站保存数据，本次的修改不会被记住';
        document.body.appendChild(warn);
      }

      // 首次渲染
      render();
    })();
  </script>
</body>
</html>
