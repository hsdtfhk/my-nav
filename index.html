<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>作业导航 · 我的网站收藏</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2329;
      --muted: #7a8293;
      --bili: #fb7299;
      --border: #ececf1;
      --shadow: 0 8px 24px rgba(31, 35, 41, 0.06);
      --name-size: 40px;
      --url-size: 15px;
      --icon-size: 36px;
      --pad-y: 28px;
      --pad-x: 30px;
    }

    body[data-size="small"] {
      --name-size: 24px;
      --url-size: 14px;
      --icon-size: 26px;
      --pad-y: 20px;
      --pad-x: 22px;
    }

    body[data-size="medium"] {
      --name-size: 40px;
      --url-size: 15px;
      --icon-size: 36px;
      --pad-y: 28px;
      --pad-x: 30px;
    }

    body[data-size="large"] {
      --name-size: 64px;
      --url-size: 16px;
      --icon-size: 50px;
      --pad-y: 36px;
      --pad-x: 36px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 48px 24px;
      display: flex;
      justify-content: center;
    }

    .container { width: 100%; max-width: 720px; }

    header { text-align: center; margin-bottom: 40px; }

    header h1 { font-size: 26px; font-weight: 700; letter-spacing: 1px; }

    header p { margin-top: 8px; color: var(--muted); font-size: 14px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      text-decoration: none;
      color: var(--text);
      padding: 32px 20px;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .card:hover { transform: translateY(-4px); box-shadow: 0 14px 32px rgba(31, 35, 41, 0.1); }

    /* B站卡片 — 醒目突出 */
    .card.bili {
      grid-column: 1 / -1;
      flex-direction: row;
      justify-content: space-between;
      padding: var(--pad-y) var(--pad-x);
      border: none;
      background: linear-gradient(135deg, #fb7299 0%, #ff9fb8 100%);
      color: #ffffff;
    }

    .card.bili .name {
      font-size: var(--name-size);
      font-weight: 800;
      letter-spacing: 0.08em;
      line-height: 1;
    }

    .card.bili .meta { text-align: right; }

    .card.bili .url { font-size: var(--url-size); color: rgba(255, 255, 255, 0.9); }

    .card.bili .hint { margin-top: 6px; font-size: 13px; color: rgba(255, 255, 255, 0.75); }

    /* 横向条卡片（普通网站） */
    .card.bar {
      grid-column: 1 / -1;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: var(--pad-y) var(--pad-x);
      border: none;
      color: #ffffff;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
      -webkit-touch-callout: none;
    }

    .card.bar:hover { transform: translateY(-3px); box-shadow: 0 14px 28px rgba(31, 35, 41, 0.14); }

    .bar-left { display: flex; align-items: center; gap: 14px; min-width: 0; }

    .card.bar .icon { font-size: var(--icon-size); line-height: 1; }

    .card.bar .name { font-size: var(--name-size); font-weight: 700; letter-spacing: 0.05em; }

    .bar-right { display: flex; align-items: center; gap: 12px; flex: none; }

    .bar-right .meta { text-align: right; }

    .bar-right .url { font-size: var(--url-size); color: rgba(255, 255, 255, 0.92); }

    .bar-right .hint { display: block; margin-top: 4px; font-size: 12px; color: rgba(255, 255, 255, 0.75); }

    .color-dot {
      width: 26px; height: 26px; border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.85);
      cursor: pointer; flex: none;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      transition: transform 0.15s ease;
    }

    .color-dot:hover { transform: scale(1.18); }

    .bar-del {
      width: 26px; height: 26px; line-height: 24px; text-align: center;
      border-radius: 50%; cursor: pointer; flex: none;
      color: rgba(255, 255, 255, 0.85); font-size: 18px;
      background: rgba(0, 0, 0, 0.12);
      transition: background 0.15s ease;
    }

    .bar-del:hover { background: rgba(0, 0, 0, 0.3); }

    .card.add {
      grid-column: 1 / -1;
      flex-direction: row;
      justify-content: center;
      gap: 10px;
      border-style: dashed;
      color: var(--muted);
      background: transparent;
      box-shadow: none;
      padding: 20px;
    }

    .card.add .plus { font-size: 24px; line-height: 1; }
    .card.add .name { font-size: 16px; }

    .card.bar.dragging {
      position: fixed;
      z-index: 100;
      margin: 0;
      opacity: 0.92;
      box-shadow: 0 20px 44px rgba(0, 0, 0, 0.3);
      transition: none;
    }

    .drag-placeholder {
      grid-column: 1 / -1;
      border-radius: 18px;
      border: 2px dashed rgba(0, 0, 0, 0.18);
      background: rgba(0, 0, 0, 0.04);
    }

    .size-control {
      position: fixed; top: 16px; left: 16px; z-index: 40;
      display: flex; align-items: center; gap: 4px;
      background: #fff; border: 1px solid var(--border);
      border-radius: 999px; padding: 4px;
      box-shadow: 0 6px 20px rgba(31, 35, 41, 0.12);
    }

    .size-control .label { font-size: 12px; color: var(--muted); padding: 0 8px 0 10px; }

    .size-btn {
      border: none; background: transparent; padding: 6px 12px;
      border-radius: 999px; font-size: 14px; cursor: pointer; color: var(--text);
      transition: background 0.15s ease, color 0.15s ease;
    }

    .size-btn.active { background: linear-gradient(135deg, #fb7299, #ff9fb8); color: #fff; }

    .modal {
      position: fixed; inset: 0; background: rgba(20, 22, 28, 0.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 20; padding: 24px;
    }

    .modal[hidden] { display: none; }

    .modal-box {
      background: #fff; border-radius: 18px; padding: 28px 26px;
      width: 100%; max-width: 360px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
    }

    .modal-box h2 { font-size: 20px; margin-bottom: 18px; }

    .modal-box label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }

    .modal-box input[type="text"] {
      width: 100%; padding: 11px 12px; border: 1px solid var(--border);
      border-radius: 10px; font-size: 15px; outline: none;
    }

    .modal-box input[type="text"]:focus { border-color: #fb7299; }

    .modal-box input[type="color"] {
      width: 100%; height: 38px; border: 1px solid var(--border);
      border-radius: 10px; padding: 4px; background: none; cursor: pointer; margin-top: 10px;
    }

    .modal-actions { display: flex; gap: 10px; margin-top: 22px; }

    .btn { flex: 1; padding: 11px; border-radius: 10px; border: none; font-size: 15px; cursor: pointer; }
    .btn.ghost { background: #f0f1f5; color: var(--text); }
    .btn.primary { background: linear-gradient(135deg, #fb7299, #ff9fb8); color: #fff; }

    .color-menu {
      position: fixed; z-index: 30; background: #fff; border-radius: 14px;
      padding: 16px; box-shadow: 0 16px 48px rgba(0, 0, 0, 0.22); min-width: 190px;
    }

    .color-menu[hidden] { display: none; }

    .color-menu .cm-title { font-size: 13px; color: var(--muted); margin-bottom: 10px; }

    .color-menu input[type="color"] {
      width: 100%; height: 36px; border: 1px solid var(--border);
      border-radius: 8px; padding: 2px; background: none; cursor: pointer;
    }

    .swatches { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

    .swatch {
      width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent; transition: transform 0.12s ease;
    }

    .swatch:hover { transform: scale(1.15); }
    .swatch.active { border-color: #1f2329; }

    .cm-reset {
      margin-top: 12px; width: 100%; padding: 8px; border: none;
      background: #f0f1f5; border-radius: 8px; font-size: 13px; cursor: pointer; color: var(--text);
    }

    footer { margin-top: 40px; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.8; }
  </style>
</head>
<body>
  <div class="size-control">
    <span class="label">大小</span>
    <button class="size-btn" data-size="large">大</button>
    <button class="size-btn" data-size="medium">中</button>
    <button class="size-btn" data-size="small">小</button>
  </div>

  <div class="container">
    <header>
      <h1>作业导航</h1>
      <p>点击卡片，一键跳转到对应网站</p>
    </header>

    <div class="grid" id="grid">
      <!-- B站：固定醒目横幅（如需修改，直接改这里） -->
      <a class="card bili" href="https://www.bilibili.com" target="_blank" rel="noopener">
        <span class="name">B 站</span>
        <span class="meta">
          <span class="url">www.bilibili.com</span>
          <span class="hint">点击进入 ↗</span>
        </span>
      </a>

      <!-- 公共网站 + 个人网站由脚本渲染到此处 -->

      <a class="card add" href="#" id="add-card">
        <span class="plus">＋</span>
        <span class="name">添加网站</span>
      </a>
    </div>

    <footer>
      点击彩色圆点、或右键卡片，即可自定义它的颜色<br />
      左上角「大 / 中 / 小」可统一调整所有卡片的大小<br />
      按住卡片上下拖动即可排序（手机需长按后再拖动）
    </footer>
  </div>

  <!-- 添加网站弹窗 -->
  <div class="modal" id="modal" hidden>
    <div class="modal-box">
      <h2>添加网站</h2>
      <label for="site-name">名称</label>
      <input id="site-name" type="text" placeholder="例如：教务系统" />
      <label for="site-url">网址</label>
      <input id="site-url" type="text" placeholder="例如：jwc.example.edu.cn" />
      <label>颜色</label>
      <div class="swatches" id="modal-swatches"></div>
      <input type="color" id="site-color" value="#64748b" />
      <div class="modal-actions">
        <button class="btn ghost" id="cancel-btn">取消</button>
        <button class="btn primary" id="save-btn">添加</button>
      </div>
    </div>
  </div>

  <!-- 颜色选择菜单 -->
  <div class="color-menu" id="color-menu" hidden>
    <div class="cm-title">自定义颜色</div>
    <input type="color" id="color-input" />
    <div class="swatches" id="menu-swatches"></div>
    <button class="cm-reset" id="reset-color">恢复默认颜色</button>
  </div>

  <script>
    (function () {
      // ============================================================
      // ★ 管理者区域：在这里添加 / 修改「公共网站」
      //   改完保存后，把整个 index.html 重新上传到 GitHub，
      //   大家刷新页面就能看到新的公共网站。
      //
      //   格式说明：
      //   id   —— 每个网站唯一的英文编号（不要重复，建议用拼音或英文）
      //   name —— 卡片上显示的名称
      //   url  —— 网址（完整网址，https:// 开头）
      //   icon —— 图标，一个 emoji 即可
      //   color—— 默认颜色（用户仍可在自己浏览器里改）
      //
      //   想新增一个公共网站，就复制下面任意一行，改一改再粘到列表末尾。
      // ============================================================
      var PUBLIC_SITES = [
        { id: 'math',    name: '高数',          url: 'https://www.icourse163.org/learn/NEU-1001639002?tid=1488009446#/learn/content', icon: '📐', color: '#4f7cff' },
        { id: 'memo',    name: '喵喵背单词',    url: 'https://studio.memocard.cn/memo-api/s/3hSF1fXoCjJTp9pzPz8FWw2SW3ZCpb-2', icon: '🐱', color: '#ff9f43' },
        { id: 'zhidao',  name: '知到',          url: 'https://onlineweb.zhihuishu.com/onlinestuh5', icon: '🎓', color: '#22c55e' },
        { id: 'iwrite',  name: '爱写作',        url: 'https://iwrite.unipus.cn', icon: '✍️', color: '#8b5cf6' },
        { id: 'dolphin', name: '海豚实验平台',  url: 'https://neu.aige.dilabs.cn/user-center/login/index', icon: '🐬', color: '#14b8a6' }
      ];

      var PALETTE = [
        '#4f7cff', '#ff9f43', '#22c55e', '#8b5cf6',
        '#14b8a6', '#fb7299', '#f43f5e', '#64748b'
      ];

      // 本地存储键（个人数据，每人浏览器一份，互不影响）
      var LS = {
        personal: 'mg2-personal', // 用户自己添加的网站
        hidden: 'mg2-hidden',     // 用户删掉的公共网站 id
        order: 'mg2-order',       // 用户排好的顺序
        colors: 'mg2-colors',     // 用户对公共网站的颜色覆盖
        size: 'mg2-size'          // 大中小档位
      };

      var grid = document.getElementById('grid');
      var addCard = document.getElementById('add-card');

      var modal = document.getElementById('modal');
      var nameInput = document.getElementById('site-name');
      var urlInput = document.getElementById('site-url');
      var modalColorInput = document.getElementById('site-color');
      var modalSwatches = document.getElementById('modal-swatches');
      var saveBtn = document.getElementById('save-btn');
      var cancelBtn = document.getElementById('cancel-btn');

      var colorMenu = document.getElementById('color-menu');
      var colorInput = document.getElementById('color-input');
      var menuSwatches = document.getElementById('menu-swatches');
      var resetBtn = document.getElementById('reset-color');

      var activeId = null;
      var modalColor = '#4f7cff';

      // ---------- 尺寸切换 ----------
      var sizeButtons = document.querySelectorAll('.size-btn');
      function applySize(size) {
        document.body.setAttribute('data-size', size);
        sizeButtons.forEach(function (b) {
          b.classList.toggle('active', b.getAttribute('data-size') === size);
        });
        localStorage.setItem(LS.size, size);
      }
      sizeButtons.forEach(function (b) {
        b.addEventListener('click', function () { applySize(b.getAttribute('data-size')); });
      });
      applySize(localStorage.getItem(LS.size) || 'medium');

      // ---------- 工具函数 ----------
      function read(key, fallback) {
        try {
          var v = JSON.parse(localStorage.getItem(key));
          return v == null ? fallback : v;
        } catch (e) { return fallback; }
      }
      function write(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

      function normalizeUrl(u) {
        u = (u || '').trim();
        if (!u) return '';
        if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
        return u;
      }

      function displayUrl(u) {
        try {
          var a = document.createElement('a');
          a.href = normalizeUrl(u);
          return a.hostname;
        } catch (e) { return u.replace(/^https?:\/\//i, ''); }
      }

      function hexToRgb(h) {
        h = h.replace('#', '');
        if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
        var n = parseInt(h, 16);
        return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
      }

      function rgbToHex(c) {
        return '#' + [c.r, c.g, c.b].map(function (x) {
          var s = x.toString(16);
          return s.length < 2 ? '0' + s : s;
        }).join('');
      }

      function mixHex(c1, c2, t) {
        var a = hexToRgb(c1);
        var b = hexToRgb(c2);
        return rgbToHex({
          r: Math.round(a.r + (b.r - a.r) * t),
          g: Math.round(a.g + (b.g - a.g) * t),
          b: Math.round(a.b + (b.b - a.b) * t)
        });
      }

      function gradient(c) { return 'linear-gradient(135deg, ' + c + ', ' + mixHex(c, '#ffffff', 0.35) + ')'; }

      function isPublicId(id) {
        return PUBLIC_SITES.some(function (p) { return p.id === id; });
      }

      // ---------- 合并：公共（去掉用户删的）+ 个人 ----------
      function visibleSites() {
        var hidden = read(LS.hidden, []);
        var personal = read(LS.personal, []);
        var colors = read(LS.colors, {});
        var list = [];

        PUBLIC_SITES.forEach(function (p) {
          if (hidden.indexOf(p.id) === -1) {
            list.push({ id: p.id, name: p.name, url: p.url, icon: p.icon, color: colors[p.id] || p.color, kind: 'public' });
          }
        });
        personal.forEach(function (s) {
          list.push({ id: s.id, name: s.name, url: s.url, icon: s.icon || '🔗', color: s.color || '#64748b', kind: 'personal' });
        });

        // 应用用户排好的顺序（新出现的公共网站追加到末尾）
        var order = read(LS.order, null);
        if (Array.isArray(order) && order.length) {
          var map = {};
          list.forEach(function (s) { map[s.id] = s; });
          var ordered = [];
          order.forEach(function (id) { if (map[id]) { ordered.push(map[id]); delete map[id]; } });
          list.forEach(function (s) { if (map[s.id]) ordered.push(s); });
          list = ordered;
        }
        write(LS.order, list.map(function (s) { return s.id; }));
        return list;
      }

      // ---------- 渲染 ----------
      function buildBar(site, index) {
        var a = document.createElement('a');
        a.className = 'card bar';
        a.setAttribute('data-id', site.id);
        a.href = normalizeUrl(site.url);
        a.target = '_blank';
        a.rel = 'noopener';
        a.style.background = gradient(site.color);
        a.setAttribute('draggable', 'false');
        a.addEventListener('dragstart', function (e) { e.preventDefault(); });

        var left = document.createElement('span');
        left.className = 'bar-left';
        var icon = document.createElement('span');
        icon.className = 'icon';
        icon.textContent = site.icon;
        var name = document.createElement('span');
        name.className = 'name';
        name.textContent = site.name;
        left.appendChild(icon);
        left.appendChild(name);

        var right = document.createElement('span');
        right.className = 'bar-right';
        var meta = document.createElement('span');
        meta.className = 'meta';
        var url = document.createElement('span');
        url.className = 'url';
        url.textContent = displayUrl(site.url);
        var hint = document.createElement('span');
        hint.className = 'hint';
        hint.textContent = '点击进入 ↗';
        meta.appendChild(url);
        meta.appendChild(hint);

        var dot = document.createElement('span');
        dot.className = 'color-dot';
        dot.title = '自定义颜色（也可右键卡片）';
        dot.style.background = site.color;
        dot.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          openColorMenu(site.id, dot);
        });

        var del = document.createElement('span');
        del.className = 'bar-del';
        del.textContent = '×';
        del.title = '删除该网站';
        del.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          removeSite(site.id);
        });

        right.appendChild(meta);
        right.appendChild(dot);
        right.appendChild(del);

        a.appendChild(left);
        a.appendChild(right);

        a.addEventListener('contextmenu', function (e) {
          e.preventDefault();
          if (lastPointerType === 'touch') return;
          openColorMenu(site.id, null, e.clientX, e.clientY);
        });

        a.addEventListener('pointerdown', function (e) {
          onPointerDown(e, index, a);
        });

        a.addEventListener('click', function (e) {
          if (suppressClick) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);

        return a;
      }

      function render() {
        var olds = grid.querySelectorAll('.card.bar');
        for (var i = 0; i < olds.length; i++) olds[i].remove();
        var list = visibleSites();
        list.forEach(function (site, i) {
          grid.insertBefore(buildBar(site, i), addCard);
        });
      }

      function removeSite(id) {
        if (isPublicId(id)) {
          var hidden = read(LS.hidden, []);
          if (hidden.indexOf(id) === -1) hidden.push(id);
          write(LS.hidden, hidden);
        } else {
          write(LS.personal, read(LS.personal, []).filter(function (s) { return s.id !== id; }));
        }
        render();
      }

      // ---------- 颜色菜单 ----------
      function fillSwatches(container, current, onPick) {
        container.innerHTML = '';
        PALETTE.forEach(function (c) {
          var s = document.createElement('span');
          s.className = 'swatch' + (c.toLowerCase() === (current || '').toLowerCase() ? ' active' : '');
          s.style.background = c;
          s.addEventListener('click', function () { onPick(c); });
          container.appendChild(s);
        });
      }

      function updateMenuSwatches(current) {
        fillSwatches(menuSwatches, current, function (c) {
          if (activeId) applyColor(activeId, c);
          colorInput.value = c;
          updateMenuSwatches(c);
        });
      }

      function siteColor(id) {
        var list = visibleSites();
        for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i].color;
        return '#64748b';
      }

      function defaultColor(id) {
        for (var i = 0; i < PUBLIC_SITES.length; i++) if (PUBLIC_SITES[i].id === id) return PUBLIC_SITES[i].color;
        return '#64748b';
      }

      function applyColor(id, color) {
        if (isPublicId(id)) {
          var colors = read(LS.colors, {});
          colors[id] = color;
          write(LS.colors, colors);
        } else {
          var personal = read(LS.personal, []);
          personal.forEach(function (s) { if (s.id === id) s.color = color; });
          write(LS.personal, personal);
        }
        var bar = grid.querySelector('.card.bar[data-id="' + id + '"]');
        if (bar) {
          bar.style.background = gradient(color);
          var dot = bar.querySelector('.color-dot');
          if (dot) dot.style.background = color;
        }
      }

      function openColorMenu(id, dot, x, y) {
        activeId = id;
        colorInput.value = siteColor(id);
        updateMenuSwatches(siteColor(id));
        colorMenu.hidden = false;

        var w = colorMenu.offsetWidth;
        var h = colorMenu.offsetHeight;
        var px, py;
        if (dot) {
          var r = dot.getBoundingClientRect();
          px = r.right - w;
          py = r.bottom + 8;
        } else {
          px = x;
          py = y;
        }
        px = Math.min(Math.max(12, px), window.innerWidth - w - 12);
        py = Math.min(Math.max(12, py), window.innerHeight - h - 12);
        colorMenu.style.left = px + 'px';
        colorMenu.style.top = py + 'px';
      }

      function closeColorMenu() {
        colorMenu.hidden = true;
        activeId = null;
      }

      colorInput.addEventListener('input', function () {
        if (activeId) {
          applyColor(activeId, colorInput.value);
          updateMenuSwatches(colorInput.value);
        }
      });

      resetBtn.addEventListener('click', function () {
        if (!activeId) return;
        var def = defaultColor(activeId);
        applyColor(activeId, def);
        colorInput.value = def;
        updateMenuSwatches(def);
      });

      document.addEventListener('click', function (e) {
        if (colorMenu.hidden) return;
        if (colorMenu.contains(e.target)) return;
        if (e.target.closest && e.target.closest('.color-dot')) return;
        closeColorMenu();
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeColorMenu();
      });

      // ---------- 添加网站弹窗 ----------
      function updateModalSwatches(current) {
        fillSwatches(modalSwatches, current, function (c) {
          modalColor = c;
          modalColorInput.value = c;
          updateModalSwatches(c);
        });
      }

      function openModal() {
        modalColor = PALETTE[Math.floor(Math.random() * PALETTE.length)];
        nameInput.value = '';
        urlInput.value = '';
        modalColorInput.value = modalColor;
        updateModalSwatches(modalColor);
        modal.hidden = false;
        nameInput.focus();
      }

      function closeModal() { modal.hidden = true; }

      addCard.addEventListener('click', function (e) { e.preventDefault(); openModal(); });
      cancelBtn.addEventListener('click', closeModal);
      modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });

      modalColorInput.addEventListener('input', function () {
        modalColor = modalColorInput.value;
        updateModalSwatches(modalColor);
      });

      saveBtn.addEventListener('click', function () {
        var name = nameInput.value.trim();
        var url = normalizeUrl(urlInput.value);
        if (!name) { nameInput.focus(); return; }
        if (!url) { urlInput.focus(); return; }
        var personal = read(LS.personal, []);
        personal.push({
          id: 'p' + Date.now() + Math.floor(Math.random() * 1000),
          name: name, url: url, icon: '🔗', color: modalColor
        });
        write(LS.personal, personal);
        render();
        closeModal();
      });

      urlInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') saveBtn.click(); });
      nameInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') urlInput.focus(); });

      // ---------- 拖动排序 ----------
      var drag = null;
      var placeholder = null;
      var suppressClick = false;
      var lastPointerType = 'mouse';

      function getBars() {
        return Array.prototype.slice.call(grid.querySelectorAll('.card.bar'))
          .filter(function (b) { return !drag || b !== drag.el; });
      }

      function barCenterY(el) {
        var r = el.getBoundingClientRect();
        return r.top + r.height / 2;
      }

      function computePlaceIndex(pointerY) {
        var bars = getBars();
        var idx = 0;
        for (var i = 0; i < bars.length; i++) {
          if (pointerY > barCenterY(bars[i])) idx++;
          else break;
        }
        return idx;
      }

      function movePlaceholder(idx) {
        var bars = getBars();
        if (idx < bars.length) grid.insertBefore(placeholder, bars[idx]);
        else grid.insertBefore(placeholder, addCard);
      }

      function reorderBarsFLIP(before) {
        for (var i = 0; i < before.length; i++) {
          var el = before[i].el;
          var delta = before[i].top - el.getBoundingClientRect().top;
          if (Math.abs(delta) > 0.5) {
            el.style.transition = 'none';
            el.style.transform = 'translateY(' + delta + 'px)';
            void el.offsetWidth;
            el.style.transition = 'transform 0.22s cubic-bezier(0.2, 0, 0, 1)';
            el.style.transform = '';
          }
        }
      }

      function beginDrag(el, index, clientX, clientY) {
        var rect = el.getBoundingClientRect();
        drag = {
          el: el,
          fromIndex: index,
          placeIndex: index,
          offsetX: clientX - rect.left,
          offsetY: clientY - rect.top
        };

        placeholder = document.createElement('div');
        placeholder.className = 'drag-placeholder';
        placeholder.style.height = rect.height + 'px';
        el.parentNode.insertBefore(placeholder, el);

        el.classList.add('dragging');
        el.style.width = rect.width + 'px';
        el.style.left = rect.left + 'px';
        el.style.top = rect.top + 'px';
        el.style.touchAction = 'none';
        document.body.style.touchAction = 'none';

        suppressClick = true;
        document.addEventListener('pointermove', onDragMove);
        document.addEventListener('pointerup', onDragEnd);
        document.addEventListener('pointercancel', onDragEnd);
      }

      function onDragMove(e) {
        if (!drag) return;
        drag.el.style.left = (e.clientX - drag.offsetX) + 'px';
        drag.el.style.top = (e.clientY - drag.offsetY) + 'px';

        var idx = computePlaceIndex(e.clientY);
        if (idx !== drag.placeIndex) {
          var before = getBars().map(function (b) {
            return { el: b, top: b.getBoundingClientRect().top };
          });
          drag.placeIndex = idx;
          movePlaceholder(idx);
          reorderBarsFLIP(before);
        }
      }

      function onDragEnd() {
        if (!drag) return;

        var order = read(LS.order, []);
        var movedId = order.splice(drag.fromIndex, 1)[0];
        if (movedId !== undefined) {
          order.splice(drag.placeIndex, 0, movedId);
          write(LS.order, order);
        }

        var el = drag.el;
        var slotRect = placeholder.getBoundingClientRect();
        var elRect = el.getBoundingClientRect();
        var dx = elRect.left - slotRect.left;
        var dy = elRect.top - slotRect.top;

        placeholder.parentNode.insertBefore(el, placeholder);
        placeholder.remove();

        getBars().forEach(function (b) {
          b.style.transition = '';
          b.style.transform = '';
        });

        el.classList.remove('dragging');
        el.style.position = '';
        el.style.left = '';
        el.style.top = '';
        el.style.width = '';
        el.style.zIndex = '';
        el.style.margin = '';
        el.style.touchAction = '';
        document.body.style.touchAction = '';

        if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
          el.style.transition = 'none';
          el.style.transform = 'translate(' + dx + 'px, ' + dy + 'px)';
          void el.offsetWidth;
          el.style.transition = 'transform 0.22s cubic-bezier(0.2, 0, 0, 1)';
          el.style.transform = '';
          setTimeout(render, 240);
        } else {
          setTimeout(render, 0);
        }

        drag = null;
        placeholder = null;
        setTimeout(function () { suppressClick = false; }, 0);
        document.removeEventListener('pointermove', onDragMove);
        document.removeEventListener('pointerup', onDragEnd);
        document.removeEventListener('pointercancel', onDragEnd);
      }

      function onPointerDown(e, index, el) {
        lastPointerType = e.pointerType || 'mouse';
        if (e.button !== 0) return;
        if (e.target.closest && e.target.closest('.color-dot, .bar-del')) return;

        var startX = e.clientX;
        var startY = e.clientY;
        var isTouch = e.pointerType === 'touch';
        var longPressTimer = null;
        var started = false;

        function cleanup() {
          if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
          document.removeEventListener('pointercancel', onUp);
        }

        function start() {
          if (started) return;
          started = true;
          cleanup();
          beginDrag(el, index, startX, startY);
        }

        function onMove(ev) {
          var dx = ev.clientX - startX;
          var dy = ev.clientY - startY;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (isTouch) { if (dist > 10) cleanup(); }
          else { if (dist > 6) start(); }
        }

        function onUp() { cleanup(); }

        if (isTouch) longPressTimer = setTimeout(start, 280);

        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
        document.addEventListener('pointercancel', onUp);
      }

      // 首次渲染
      render();
    })();
  </script>
</body>
</html>
